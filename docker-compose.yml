networks:
    petio-network-v2:
        driver: bridge

volumes:
    shared_folder_09:
        driver_opts:
            type: cifs
            o: "${CIFS_MOUNT_OPTS}"
            device: "${CIFS_DEVICE}"
    bazarr-db:
    radarr-config:

services:
  petio:
    image: ghcr.io/petio-team/petio:latest
    container_name: petio
    hostname: petio
    ports:
        - '7777:7777'
    networks:
        - petio-network-v2
    depends_on:
        - mongo
    environment:
        - TZ=${GLOBAL_TZ}
    restart: unless-stopped
    volumes:
        - ./petio/config:/app/api/config
        - ./petio/logs:/app/logs

  mongo:
    image: mongo
    container_name: mongo
    hostname: mongo
    networks:
        - petio-network-v2
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    volumes:
        - ./mongo/db:/data/db

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    ports:
      - "9696:9696"
    environment:
      - TZ=${GLOBAL_TZ}
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${GLOBAL_TZ}
    ports:
      - "5055:5055"
    volumes:
      - ./seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - TZ=${GLOBAL_TZ}
    volumes:
      - ./heimdall/config:/config
    ports:
      - '11080:80'
      - '11443:443'
    restart: unless-stopped

  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    container_name: "nginx"
    environment:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "${NPM_DB_USER}"
      DB_MYSQL_PASSWORD: "${NPM_DB_PASSWORD}"
      DB_MYSQL_NAME: "${NPM_DB_NAME}"
    volumes:
      - ./srv/config/nginxproxymanager:/data
      - ./srv/config/nginxproxymanager/letsencrypt:/etc/letsencrypt
    depends_on:
      - db

  db:
    image: 'jc21/mariadb-aria:latest'
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ./srv/config/nginxproxymanager/db:/var/lib/mysql

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${RADARR_PUID}
      - PGID=${RADARR_PGID}
      - TZ=${GLOBAL_TZ}
    volumes:
      - radarr-config:/config
      # MediaCover kept on host to avoid slow Docker Desktop chown; restore bind after startup if needed:
      # - ./radarr/MediaCover.tmp:/config/MediaCover
      - D:\:/ddrive
      - G:\:/gdrive
      - E:\:/edrive
      # F:\:/fdrive  # temporarily disabled: Docker Desktop F: mount error
      - shared_folder_09:/plexandria
    ports:
      - "7878:7878"
    restart: unless-stopped

  radarr-4k:
    container_name: radarr-4k
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${RADARR_PUID}
      - PGID=${RADARR_PGID}
      - TZ=${GLOBAL_TZ}
    volumes:
      - ./radarr-4k/config:/config
      - D:\:/ddrive #path to nzbget 
      - shared_folder_09:/plexandria
    ports:
      - 10200:7878
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=${SONARR_PUID}
      - PGID=${SONARR_PGID}
      - TZ=${GLOBAL_TZ}
    volumes:
      - ./sonarr/config:/config
      - D:\:/ddrive                     # d drive mount for download location 
      - shared_folder_09:/plexandria       # nas drive
      - G:\TV Series:/gdrive
      - E:\Television:/edrive
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=${BAZARR_PUID}
      - PGID=${BAZARR_PGID}
      - TZ=${GLOBAL_TZ}
    volumes:
      - ./bazarr/config:/config
      - bazarr-db:/config/db
      - D:\:/ddrive
      - G:\:/gdrive
      - E:\:/edrive
      - G:\TV Series:/sonarr_gdrive
      - E:\Television:/sonarr_edrive
      - shared_folder_09:/plexandria
    ports:
      - "6767:6767"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=${GLOBAL_TZ}
      - DOCKER_API_VERSION=1.41
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
      - 'WATCHTOWER_NOTIFICATION_TEMPLATE={{- if (or .Report.Updated .Report.Failed) -}}Watchtower Daily Report: {{len .Report.Updated}} updated, {{len .Report.Failed}} failed{{range .Report.Updated}}{{printf "\n- %s (%s -> %s)" .Name .CurrentImageID.ShortID .LatestImageID.ShortID}}{{end}}{{range .Report.Failed}}{{printf "\n- %s failed: %s" .Name .Error}}{{end}}{{- end -}}'
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_DISCORD_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    environment:
      - TZ=${GLOBAL_TZ}
      - PORT=7575
    healthcheck:
      test: ["CMD-SHELL", "IP=$$(hostname -i | cut -d' ' -f1); wget --spider --quiet http://$$IP:7575 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ./homarr/configs:/app/data/configs
      - ./homarr/icons:/app/public/icons
    ports:
      - '7575:7575'

